<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xtreme Wake Marine</title>
<meta name="description" content="Veteran-owned boat service and sales in Chico." />
<link rel="icon" href="photos/shop/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="#/">
      <img src="photos/shop/logo.png" alt="Xtreme Wake Marine" />
      <span class="wordmark">XTREME WAKE MARINE</span>
    </a>
    <button class="menu-btn" type="button" id="menu">Menu</button>
    <nav class="links" id="links">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/inventory" data-nav="inventory">Inventory</a>
      <a href="#/services" data-nav="services">Services</a>
      <a href="#/about" data-nav="about">About</a>
      <a href="#/contact" data-nav="contact">Contact</a>
      <a class="call" data-phone href="tel:5309062022">530-906-2022</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<footer>
  <div class="wrap">
    <div>
      <strong data-name>Xtreme Wake Marine</strong>
      <div>Veteran owned · Chico, CA</div>
    </div>
    <div>
      <span data-address>247 Meyers Street<br />Chico, CA 95928</span><br />
      <a data-phone href="tel:5309062022">530-906-2022</a>
      · <a data-email href="mailto:xtremewakemarine@gmail.com">xtremewakemarine@gmail.com</a>
      <div data-hours style="white-space: pre-line"></div>
    </div>
  </div>
</footer>
<a class="admin" href="admin/">Admin</a>
<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field" />
  <input name="name" />
  <input name="contact" />
  <input name="need" />
  <textarea name="message"></textarea>
</form>
<script src="app.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
